<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171c2a" media="(prefers-color-scheme: dark)">
  <!-- 修改这里可以更改浏览器标签页上的标题。 -->
  <title>Comprehensive Inner Service</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="./assets/direction.svg" type="image/svg+xml">
</head>
<body>
  <main class="page">
    <!-- 对称方向标志象征清晰判断与统筹；装饰不包含其他文字。 -->

      <span class="masthead-line"></span>
      <img class="emblem" src="./assets/direction.svg" alt="" width="120" height="120">
      <span class="masthead-line"></span>
    </div>

    <div class="hero">
      <!-- 完整网站标题：直接修改下面的文字，保留标签即可。 -->

        <span class="title-line">Comprehensive</span>
        <span class="title-line inner-service">Inner Service</span>
      </h1>
      <div class="title-rule" aria-hidden="true"></div>
    </div>

    <div class="baseline" aria-hidden="true"></div>

</html>
